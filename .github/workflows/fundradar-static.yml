name: FundRadar Static

# 每个交易日 14:20（北京时间）在云端生成报告，发布到 GitHub Pages。
# GitHub 的定时任务可能有几分钟延迟；不保证 14:20 整点触发。
on:
  schedule:
    - cron: "20 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fundradar-static
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config from secret
        env:
          FUNDRADAR_CONFIG: ${{ secrets.FUNDRADAR_CONFIG }}
        run: |
          if [ -z "$FUNDRADAR_CONFIG" ]; then
            echo "::error::缺少仓库 Secret：FUNDRADAR_CONFIG"
            echo "请在 Settings → Secrets and variables → Actions 添加你的 config.json 内容。"
            exit 1
          fi
          printf '%s' "$FUNDRADAR_CONFIG" > config.json

      - name: Run fund radar (trading days only)
        run: python run.py --scheduled

      - name: Build privacy-safe static page
        run: python publish_static.py

      - name: Setup Pages
        if: hashFiles('public/index.html') != ''
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: hashFiles('public/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: hashFiles('public/index.html') != ''
        id: deployment
        uses: actions/deploy-pages@v4

      # 每天提交一个心跳，避免 GitHub 因仓库 60 天无活动停用定时任务。
      - name: Keep scheduled workflow alive
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-run.txt
          git config user.name "FundRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/last-run.txt
          git commit -m "chore: heartbeat $(date -u +%F)" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
